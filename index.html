<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Risultati modelli FV</title>
  <link rel="stylesheet" href="style.css">
  <script src="vendor/plotly.min.js"></script>
  <script src="data.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <h1>Previsione della potenza FV</h1>
        <p class="sub" id="build-info">Risultati dei modelli</p>
      </div>
      <div class="topbar-actions">
        <span class="chip warn" id="material-chip" hidden></span>
        <button type="button" class="ghost-btn" id="theme-btn" aria-label="Cambia tema">Tema: auto</button>
      </div>
    </div>
    <nav class="tabs" id="tabs" aria-label="Dataset e sezioni"></nav>
    <div class="subbar" id="subbar" hidden>
      <nav class="subtabs" id="subtabs" aria-label="Pagine del dataset"></nav>
    </div>
  </header>

  <main id="view" class="view" tabindex="-1"></main>

  <div class="lightbox" id="lightbox" hidden>
    <div class="lightbox-inner" role="dialog" aria-modal="true" aria-label="Grafico originale">
      <div class="lightbox-head">
        <div>
          <p class="lightbox-title" id="lb-title"></p>
          <p class="lightbox-path" id="lb-path"></p>
        </div>
        <div class="lightbox-actions">
          <a id="lb-open" target="_blank" rel="noopener" class="ghost-btn">Apri a dimensione intera</a>
          <button type="button" class="ghost-btn" id="lb-close">Chiudi</button>
        </div>
      </div>
      <img id="lb-img" alt="">
    </div>
  </div>

  <noscript><p class="empty">Questa pagina richiede JavaScript.</p></noscript>
  <script src="testi.js"></script>
  <script src="app.js"></script>
</body>
</html>
